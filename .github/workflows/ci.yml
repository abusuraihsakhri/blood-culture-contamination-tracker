name: CI and GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -p no:zarr -v

      - name: Run CLI smoke tests
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          python simulator.py 50 --seed 7
          rm -f out_smoke.csv

      - name: Check browser JavaScript
        run: |
          node --check web_core.js
          node --check app.js
          node - <<'NODE'
          const core = require('./web_core.js');
          const crbsi = core.adjudicateCase({
            organism: 'coagulase_negative_staphylococcus',
            bottlesDrawn: 2,
            bottlesPositive: 2,
            ttpHours: 14,
            centralTtpHours: 14,
            peripheralTtpHours: 18
          });
          if (crbsi.dttpHours !== 4 || !crbsi.verdict.includes('CRBSI')) process.exit(1);
          const reversed = core.adjudicateCase({
            organism: 'coagulase_negative_staphylococcus',
            bottlesDrawn: 2,
            bottlesPositive: 2,
            centralTtpHours: 18,
            peripheralTtpHours: 14
          });
          if (reversed.verdict.includes('CRBSI')) process.exit(1);
          const ci = core.wilsonCI(3, 100);
          if (!(ci[0] < 3 && ci[1] > 3)) process.exit(1);
          NODE

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
